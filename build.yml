name: Build Trend Center Jordan POS V118 (Icon Master Edition)
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pywin32 pandas openpyxl arabic-reshaper python-bidi pyautogui
      - name: Build with PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --add-data "icon.png;." --add-data "icon.ico;." --icon "icon.ico" --name "Trend_Center_Jordan_V118" main.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trend_Center_Jordan_V118_EXE
          path: dist/Trend_Center_Jordan_V118.exe
